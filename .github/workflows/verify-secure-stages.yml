name: Secure kit stage verification
on:
  push:
    branches: [codex/secure-kit-stages]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secure-kit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  crypto-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned browser cryptography
        run: |
          mkdir -p /tmp/zfc-crypto-build
          cd /tmp/zfc-crypto-build
          npm install --no-save --package-lock=false @noble/hashes@2.4.0 @noble/ciphers@2.4.0 esbuild@0.25.10
          cat > entry.js <<'JS'
          import {sha256,sha512} from '@noble/hashes/sha2.js';
          import {hmac} from '@noble/hashes/hmac.js';
          import {hkdf} from '@noble/hashes/hkdf.js';
          import {gcm} from '@noble/ciphers/aes.js';
          const api={sha256,sha512,hmac256:(key,data)=>hmac(sha256,key,data),hkdf256:(key,salt,info,size=32)=>hkdf(sha256,key,salt,info,size),encryptGCM:(key,nonce,plain,aad)=>gcm(key,nonce,aad).encrypt(plain),decryptGCM:(key,nonce,cipher,aad)=>gcm(key,nonce,aad).decrypt(cipher)};
          if(typeof window!=='undefined')window.ZfcCrypto=api;
          if(typeof module!=='undefined')module.exports=api;
          JS
          ./node_modules/.bin/esbuild entry.js --bundle --format=iife --global-name=ZfcCryptoBundle --minify --outfile=zfc-crypto.js
          cp node_modules/@noble/{hashes,ciphers}/LICENSE .
          sha256sum zfc-crypto.js > SHA256.txt
          dpkg-query -W libc6
      - name: Mirror host mbedTLS test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmbedtls-dev
          mkdir -p /tmp/zfc-crypto-build/host/include /tmp/zfc-crypto-build/host/lib
          cp -r /usr/include/mbedtls /tmp/zfc-crypto-build/host/include/
          cp /usr/lib/x86_64-linux-gnu/libmbedcrypto* /tmp/zfc-crypto-build/host/lib/
          cp /usr/lib/x86_64-linux-gnu/libmbedtls* /tmp/zfc-crypto-build/host/lib/
          cp /usr/lib/x86_64-linux-gnu/libmbedx509* /tmp/zfc-crypto-build/host/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: secure-crypto-dependencies
          path: |
            /tmp/zfc-crypto-build/zfc-crypto.js
            /tmp/zfc-crypto-build/SHA256.txt
            /tmp/zfc-crypto-build/host
