name: Build Aerion Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/app/**'
      - 'VERSION.txt'
      - '.gitignore'
      - 'android-app/.gitignore'
      - 'release-integrity.json'
      - 'tools/cleanup_repo.py'
      - 'tools/project_files.py'
      - 'tools/release_integrity.py'
      - 'android-app/tools/build_apk.py'
      - 'android-app/tests/**'
      - 'android-app/signing/aerion-development.p12'
      - '.github/workflows/build-aerion-android.yml'
      - 'tools/embed_ap_pages.py'
      - 'tools/flight_app_source.html'
      - 'control-sticks.js'
      - 'mobile-flight-console.js'
      - 'flight-recorder.js'
      - 'fc-setup.js'
      - 'kit-console.js'
  pull_request:
    paths:
      - '.gitignore'
      - 'android-app/**'
      - '.github/workflows/build-aerion-android.yml'
      - 'tools/embed_ap_pages.py'
      - 'tools/flight_app_source.html'
      - 'control-sticks.js'
      - 'mobile-flight-console.js'
      - 'flight-recorder.js'
      - 'fc-setup.js'
      - 'kit-console.js'

permissions:
  contents: write

concurrency:
  group: aerion-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-app
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Require all upload helpers before checking the release
        working-directory: .
        run: |
          set -euo pipefail
          for aerion_required in tools/cleanup_repo.py tools/project_files.py tools/release_integrity.py release-integrity.json; do
            if [ ! -s "$aerion_required" ]; then
              echo "::error file=$aerion_required::Incomplete upload: missing $aerion_required. Upload the complete final batch to the same branch, then start a new workflow run on that updated branch."
              exit 1
            fi
          done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify completed release upload
        run: |
          python3 -B ../tools/cleanup_repo.py
          python3 -B ../tools/release_integrity.py --check
      - name: Install Android SDK platform and build tools
        run: |
          set -euo pipefail
          aerion_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$aerion_sdk"
          "$aerion_sdk/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify shared offline UI
        run: python3 ../tools/embed_ap_pages.py --check
      - name: Test native control and app-link policy
        run: |
          set -euo pipefail
          mkdir -p build/core-tests
          javac -d build/core-tests app/src/main/java/in/zebjus/aerion/LeaseGate.java app/src/main/java/in/zebjus/aerion/LocalPolicy.java app/src/main/java/in/zebjus/aerion/LaunchPolicy.java app/src/main/java/in/zebjus/aerion/NativeRcStream.java app/src/main/java/in/zebjus/aerion/RouterNetworkPolicy.java tests/LeaseGateTest.java tests/NativeRcStreamTest.java tests/RouterNetworkPolicyTest.java
          java -cp build/core-tests in.zebjus.aerion.LeaseGateTest
          java -cp build/core-tests in.zebjus.aerion.NativeRcStreamTest
          java -cp build/core-tests in.zebjus.aerion.RouterNetworkPolicyTest
      - name: Build and sign development APK
        env:
          AERION_DEVELOPMENT_STORE_PASSWORD: ${{ secrets.AERION_DEVELOPMENT_STORE_PASSWORD || 'aerion-development' }}
        run: |
          set -euo pipefail
          aerion_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          python3 tools/build_apk.py --build-tools "$aerion_sdk/build-tools/36.0.0" --android-jar "$aerion_sdk/platforms/android-36/android.jar"
      - name: Refresh manifests and publish generated APK
        working-directory: .
        run: |
          set -euo pipefail
          PUB_DIR="$(mktemp -d)"
          mkdir -p "$PUB_DIR/android-app/dist" "$PUB_DIR/android-app"
          cp android-app/dist/ZEBJUS_Aerion_V18_3_75_Android.apk android-app/dist/BUILD_REPORT.json android-app/dist/APK_SIGNATURE.txt android-app/dist/APK_MANIFEST.txt "$PUB_DIR/android-app/dist/"
          cp android-app/VERIFICATION.json "$PUB_DIR/android-app/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git diff --quiet "${GITHUB_SHA}" origin/main -- android-app/app android-app/tests tools/flight_app_source.html tools/test_connection_stability.js .github/workflows/build-aerion-android.yml; then
              echo "Newer Android/control source is already on main; refusing to publish a stale APK."
              exit 0
            fi
            git reset --hard origin/main
            cp "$PUB_DIR/android-app/dist/"* android-app/dist/
            cp "$PUB_DIR/android-app/VERIFICATION.json" android-app/VERIFICATION.json
            python3 tools/make_offline_manifest.py
            python3 -B tools/release_integrity.py --write
            git add android-app/dist/ZEBJUS_Aerion_V18_3_75_Android.apk android-app/dist/BUILD_REPORT.json android-app/dist/APK_SIGNATURE.txt android-app/dist/APK_MANIFEST.txt android-app/VERIFICATION.json offline-manifest.json release-integrity.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Build Aerion Android 18.3.75-android.2 package"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "APK was built and uploaded as an Actions artifact, but repository publication could not complete after 4 attempts."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Aerion-Android-APK
          if-no-files-found: error
          path: |
            android-app/dist/ZEBJUS_Aerion_V18_3_75_Android.apk
            android-app/dist/BUILD_REPORT.json
            android-app/dist/APK_SIGNATURE.txt
            android-app/dist/APK_MANIFEST.txt

# Download the APK from Actions -> successful run -> Artifacts.
# This uses the included public development key, not production signing.
# It does not deploy a website or publish to Google Play.
