name: Build Aerion Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/app/**'
      - 'VERSION.txt'
      - 'release-integrity.json'
      - 'tools/cleanup_repo.py'
      - 'tools/project_files.py'
      - 'tools/release_integrity.py'
      - 'android-app/tools/build_apk.py'
      - 'android-app/tests/**'
      - 'android-app/signing/aerion-development.p12'
      - '.github/workflows/build-aerion-android.yml'
      - 'tools/embed_ap_pages.py'
      - 'tools/flight_app_source.html'
      - 'control-sticks.js'
      - 'kit-console.js'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-aerion-android.yml'
      - 'tools/embed_ap_pages.py'
      - 'tools/flight_app_source.html'
      - 'control-sticks.js'
      - 'kit-console.js'

permissions:
  contents: read

concurrency:
  group: aerion-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-app
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Require all upload helpers before checking the release
        working-directory: .
        run: |
          set -euo pipefail
          for aerion_required in tools/cleanup_repo.py tools/project_files.py tools/release_integrity.py release-integrity.json; do
            if [ ! -s "$aerion_required" ]; then
              echo "::error file=$aerion_required::Incomplete upload: missing $aerion_required. Upload the complete final batch to the same branch before rerunning."
              exit 1
            fi
          done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify completed release upload
        run: |
          python3 -B ../tools/cleanup_repo.py
          python3 -B ../tools/release_integrity.py --check
      - name: Install Android SDK platform and build tools
        run: |
          set -euo pipefail
          aerion_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$aerion_sdk"
          "$aerion_sdk/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify shared offline UI
        run: python3 ../tools/embed_ap_pages.py --check
      - name: Test native control and app-link policy
        run: |
          set -euo pipefail
          mkdir -p build/core-tests
          javac -d build/core-tests app/src/main/java/in/zebjus/aerion/LeaseGate.java app/src/main/java/in/zebjus/aerion/LocalPolicy.java app/src/main/java/in/zebjus/aerion/LaunchPolicy.java tests/LeaseGateTest.java
          java -cp build/core-tests in.zebjus.aerion.LeaseGateTest
      - name: Build and verify development APK
        run: |
          set -euo pipefail
          aerion_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          python3 tools/build_apk.py --build-tools "$aerion_sdk/build-tools/36.0.0" --android-jar "$aerion_sdk/platforms/android-36/android.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: Aerion-Android-APK
          if-no-files-found: error
          path: |
            android-app/dist/ZEBJUS_Aerion_V18_3_62_Android.apk
            android-app/dist/BUILD_REPORT.json
            android-app/dist/APK_SIGNATURE.txt
            android-app/dist/APK_MANIFEST.txt

# Download the APK from Actions -> successful run -> Artifacts.
# This uses the included public development key, not production signing.
# It does not deploy a website or publish to Google Play.
