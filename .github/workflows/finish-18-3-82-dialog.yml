name: Verify Aerion 18.3.82 native simulator handoff
on:
  push:
    branches: [codex/release-18-3-82-pair-fence]
permissions:
  contents: write
jobs:
  signed-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Android build tools
        run: |
          set -euo pipefail
          aerion_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$aerion_sdk"
          "$aerion_sdk/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify the already rebuilt signed APK
        run: |
          set -euo pipefail
          aerion_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          python3 -B tools/embed_ap_pages.py --check
          python3 -B android-app/tools/build_apk.py --verify-only --build-tools "$aerion_sdk/build-tools/36.0.0" --android-jar "$aerion_sdk/platforms/android-36/android.jar"
          python3 - <<'PY'
          import json
          from pathlib import Path
          verified=json.loads(Path('android-app/VERIFICATION.json').read_text())
          assert verified['certificate_sha256']=='0286c9c3d51284e695cd900d87b6cc7a99ae47991c27cd42c0313fd9f1780f9c'
          PY
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify connection dialog, native transport and simulator
        run: |
          set -euo pipefail
          npm run test:mobile-view
          node android-app/tests/browser_transport_test.js
          node android-app/tests/browser_reconnect_test.js
          npm run test:training-browser
          for aerion_handoff in 1 2 3; do
            node android-app/tests/browser_modes_test.js
          done
          node tools/test_reconnect_runtime.js
          npm run test:ownership
      - name: Record verified simulator handoff and seal release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('VALIDATION_REPORT.txt')
          text=p.read_text()
          text += '\nNative simulator handoff regression: the browser pilot waits for a fresh, exact-run Java native acknowledgement of neutral channels before manual ARM. A held Web Start acknowledgement exercises early manual app ARM: the virtual lesson waits for confirmation and starts once without resetting its ARM state. Tripod/Flight input and output inhibition passed three consecutive complete native publisher browser runs.\n'
          p.write_text(text)
          Path('.github/workflows/finish-18-3-82-dialog.yml').unlink()
          PY
          npm run release:seal
          npm run check
          npm run release:check
          python3 -B tools/embed_ap_pages.py --check
          git diff --check
      - name: Retain final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Aerion-18.3.82-Final-APK
          path: |
            android-app/dist/ZEBJUS_Aerion_V18_3_82_Android.apk
            android-app/dist/BUILD_REPORT.json
            android-app/VERIFICATION.json
      - name: Publish verified candidate on isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish 18.3.82 connection dialog and matching signed APK [skip ci]'
          git push origin HEAD:codex/release-18-3-82-pair-fence
