name: Verify staged kit compatibility
on:
  push:
    branches: [codex/unique-kit-stages]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kit-stages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify delivered Android APK from source
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
          python3 android-app/tools/build_apk.py --verify-only --build-tools "$ANDROID_HOME/build-tools/36.0.0" --android-jar "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Verify control and recorded evidence
        run: |
          npm run test:ownership
          npm run test:stability
          npm run test:control
          npm run test:wifi
          npm run test:recorder
      - name: Verify native networking
        run: |
          mkdir -p /tmp/aerion-native-tests
          javac -d /tmp/aerion-native-tests android-app/app/src/main/java/in/zebjus/aerion/{LeaseGate,NativeRcStream,LocalPolicy,LaunchPolicy,RouterNetworkPolicy}.java android-app/tests/{LeaseGateTest,NativeRcStreamTest,RouterNetworkPolicyTest}.java
          java -cp /tmp/aerion-native-tests in.zebjus.aerion.LeaseGateTest
          java -cp /tmp/aerion-native-tests in.zebjus.aerion.NativeRcStreamTest
          java -cp /tmp/aerion-native-tests in.zebjus.aerion.RouterNetworkPolicyTest
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify app and web together
        run: |
          npm run test:network
          npm run test:mobile-view
          npm run test:setup-session
          npm run test:wifi-browser
          node android-app/tests/browser_modes_test.js
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARDUINO_NETWORK_CONNECTION_TIMEOUT: 120s
    steps:
      - uses: actions/checkout@v5
      - name: Configure Arduino cache
        run: |
          printf '%s\n' "ARDUINO_DIRECTORIES_DATA=$RUNNER_TEMP/zebjus-arduino/data" "ARDUINO_DIRECTORIES_DOWNLOADS=$RUNNER_TEMP/zebjus-arduino/downloads" >> "$GITHUB_ENV"
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zebjus-arduino
          key: ${{ runner.os }}-arduino-1.5.1-esp32-3.3.12-complete-v1
      - name: Compile and verify both controllers
        run: |
          python3 -B tools/build_firmware.py --install-only
          python3 tools/embed_ap_pages.py --check
          python3 -B tools/build_firmware.py --board all --skip-core-install
      - uses: actions/upload-artifact@v4
        with:
          name: stage-firmware
          if-no-files-found: error
          path: |
            FlightCore_Firmware/ZEBJUS_FLIGHTCORE_*_APP.bin
            FlightCore_Firmware/ZEBJUS_FLIGHTCORE_*_FACTORY.bin
            FlightCore_Firmware/catalog.json
            FlightCore_Firmware/build-report.json
            FlightCore_Firmware/latest.json
            firmware-catalog.json
            firmware-latest.json
