name: Provide browser test binary
on:
  push:
    branches: [codex/browser-test-tools]
permissions:
  contents: read
jobs:
  browser-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p /tmp/aerion-browser-tools
          cd /tmp/aerion-browser-tools
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install chromium --only-shell
          tar -czf browser.tar.gz -C /home/runner/.cache/ms-playwright chromium_headless_shell-1194
          split -b 24000000 browser.tar.gz browser.part-
      - uses: actions/upload-artifact@v4
        with:
          name: aerion-browser-part-aa
          path: /tmp/aerion-browser-tools/browser.part-aa
      - uses: actions/upload-artifact@v4
        with:
          name: aerion-browser-part-ab
          path: /tmp/aerion-browser-tools/browser.part-ab
      - uses: actions/upload-artifact@v4
        with:
          name: aerion-browser-part-ac
          path: /tmp/aerion-browser-tools/browser.part-ac
      - uses: actions/upload-artifact@v4
        with:
          name: aerion-browser-part-ad
          path: /tmp/aerion-browser-tools/browser.part-ad
