name: Build ZEBJUS FlightCore Firmware
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'FlightCore_Firmware/ZEBJUS_FLIGHTCORE.ino'
      - 'FlightCore_Firmware/*.h'
      - 'tools/embed_ap_pages.py'
      - 'tools/flight_app_source.html'
      - 'control-sticks.js'
      - 'fc-setup.js'
      - 'kit-console.js'
      - 'FlightCore_Firmware/src/**'
      - 'FlightCore_Firmware/catalog.json'
      - 'VERSION.txt'
      - '.gitignore'
      - 'android-app/.gitignore'
      - 'release-integrity.json'
      - 'tools/release_integrity.py'
      - 'tools/project_files.py'
      - 'tools/test_upload_integrity.py'
      - 'tools/build_firmware.py'
      - 'tools/cleanup_repo.py'
      - 'tools/make_offline_manifest.py'
      - 'tools/validate_offline_bundle.py'
      - '.github/workflows/build-flightcore-a1.yml'

permissions:
  contents: write

# If a newer source/workflow commit arrives, cancel the older firmware job.
# Asset-only uploads do not trigger this workflow, so the publish step below
# safely rebases generated firmware onto those newer repository commits.
concurrency:
  group: flightcore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-upload:
    name: Verify complete upload
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Require every final-batch helper
        working-directory: .
        run: |
          set -euo pipefail
          for aerion_required in tools/cleanup_repo.py tools/project_files.py tools/release_integrity.py release-integrity.json; do
            if [ ! -s "$aerion_required" ]; then
              echo "::error file=$aerion_required::Incomplete upload: missing $aerion_required. Upload the complete final batch to the same branch, then start a new workflow run on that updated branch."
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove known obsolete packaging leftovers
        run: python3 -B tools/cleanup_repo.py
      - name: Reject incomplete or mixed upload batches
        run: python3 -B tools/release_integrity.py --check
      - name: Validate project, binary hashes and offline assets
        run: npm run check
      - name: Check input routing, reconnect, camera cleanup and upload guards
        run: |
          npm run test:control
          npm run test:setup
          npm run test:wifi
          python3 -B tools/test_upload_integrity.py
          npm run test:flight-math
          npm run test:rc-link
          npm run test:fc-setup
  build-flightcore:
    needs: verify-upload
    if: github.actor != 'github-actions[bot]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ARDUINO_NETWORK_CONNECTION_TIMEOUT: 120s
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure Arduino cache directories
        run: |
          printf '%s\n' "ARDUINO_DIRECTORIES_DATA=$RUNNER_TEMP/zebjus-arduino/data" "ARDUINO_DIRECTORIES_DOWNLOADS=$RUNNER_TEMP/zebjus-arduino/downloads" >> "$GITHUB_ENV"
      - name: Normalize repository inventory
        run: python3 -B tools/cleanup_repo.py
      - name: Verify this checkout before dependency setup
        run: python3 -B tools/release_integrity.py --check
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Restore pinned Arduino core and downloaded packages
        id: arduino-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/zebjus-arduino
          key: ${{ runner.os }}-arduino-1.5.1-esp32-3.3.12-complete-v1
          restore-keys: |
            ${{ runner.os }}-arduino-1.5.1-esp32-3.3.12-partial-v1-
      - name: Check dependency setup failure handling
        run: |
          python3 -B tools/test_firmware_setup.py
          python3 -B tools/test_simulator_rc_runtime.py
      - name: Install pinned ESP32 core with bounded download retries
        id: arduino-setup
        run: python3 -B tools/build_firmware.py --install-only
      - name: Preserve completed downloads even if installation fails
        if: ${{ always() && (steps.arduino-setup.outcome == 'success' || steps.arduino-setup.outcome == 'failure') && steps.arduino-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/zebjus-arduino
          key: ${{ steps.arduino-setup.outcome == 'success' && format('{0}-arduino-1.5.1-esp32-3.3.12-complete-v1', runner.os) || format('{0}-arduino-1.5.1-esp32-3.3.12-partial-v1-{1}-{2}', runner.os, github.run_id, github.run_attempt) }}
      - name: Generate shared offline flight app
        run: python3 tools/embed_ap_pages.py
      - name: Check flight math and RC gap/protocol policy
        run: |
          g++ -std=c++17 tools/test_flight_math.cpp -o /tmp/aerion-flight-math
          /tmp/aerion-flight-math
          npm run test:rc-link
          npm run test:fc-setup
      - name: Compile all supported FlightCore boards
        run: python3 -B tools/build_firmware.py --board all --skip-core-install
      - name: Clean obsolete release leftovers and refresh inventory
        run: python3 tools/cleanup_repo.py
      - name: Refresh offline hashes after firmware build
        run: python3 tools/make_offline_manifest.py
      - name: Seal generated firmware and metadata into release integrity
        run: python3 -B tools/release_integrity.py --write
      - name: Validate produced firmware
        run: |
          test -s FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A1_APP.bin
          test -s FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A2_APP.bin
          echo "Both required APP images exist:"
          ls -lh FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A1_APP.bin FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A2_APP.bin
          sha256sum FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A1_APP.bin FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A2_APP.bin
          for f in FlightCore_Firmware/ZEBJUS_FLIGHTCORE_*_FACTORY.bin; do
            [ -e "$f" ] || continue
            test -s "$f"
            sha256sum "$f"
          done
          python3 tools/validate_project.py
          python3 tools/validate_offline_bundle.py
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZEBJUS_FLIGHTCORE_FIRMWARE
          path: |
            FlightCore_Firmware/ZEBJUS_FLIGHTCORE_*_APP.bin
            FlightCore_Firmware/ZEBJUS_FLIGHTCORE_*_FACTORY.bin
            FlightCore_Firmware/catalog.json
            FlightCore_Firmware/latest.json
            firmware-catalog.json
            firmware-latest.json
      - name: Publish stable firmware files into repository
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve verified generated outputs outside the worktree before
          # syncing to a newer asset-only repository commit.
          PUB_DIR="$(mktemp -d)"
          mkdir -p "$PUB_DIR/FlightCore_Firmware"
          cp FlightCore_Firmware/ZEBJUS_FLIGHTCORE_*_APP.bin "$PUB_DIR/FlightCore_Firmware/"
          for f in FlightCore_Firmware/ZEBJUS_FLIGHTCORE_*_FACTORY.bin; do
            [ -e "$f" ] || continue
            cp "$f" "$PUB_DIR/FlightCore_Firmware/"
          done
          cp FlightCore_Firmware/catalog.json FlightCore_Firmware/latest.json FlightCore_Firmware/build-report.json "$PUB_DIR/FlightCore_Firmware/"
          cp firmware-catalog.json firmware-latest.json "$PUB_DIR/"

          VERSION="$(python3 -c 'import json; print(json.load(open("FlightCore_Firmware/catalog.json"))["version"])')"

          # Web uploads may advance main while compilation is running. Retry
          # publication without discarding those user commits. If actual core
          # inputs changed, the concurrency rule starts/cancels in favour of
          # the newer build instead of publishing stale firmware.
          for attempt in 1 2 3 4; do
            echo "Publish attempt ${attempt}/4"
            git fetch origin main

            if ! git diff --quiet "${GITHUB_SHA}" origin/main --               FlightCore_Firmware/ZEBJUS_FLIGHTCORE.ino               'FlightCore_Firmware/*.h' tools/embed_ap_pages.py tools/ap_portal_source.html tools/flight_app_source.html tools/ap_io_source.html control-sticks.js fc-setup.js kit-console.js               FlightCore_Firmware/src               FlightCore_Firmware/catalog.json               VERSION.txt release-integrity.json tools/release_integrity.py tools/project_files.py tools/test_upload_integrity.py tools/build_firmware.py tools/cleanup_repo.py tools/make_offline_manifest.py tools/validate_offline_bundle.py               .github/workflows/build-flightcore-a1.yml; then
              echo "A newer firmware source/build workflow is already on main."
              echo "This run will not publish stale binaries; the newer workflow run owns publication."
              exit 0
            fi

            git reset --hard origin/main
            python3 -B tools/cleanup_repo.py
            if ! python3 -B tools/release_integrity.py --check; then
              echo "Newer main contains an incomplete upload. Keeping this run's verified artifacts; the completed upload will trigger its own build."
              exit 0
            fi
            cp "$PUB_DIR"/FlightCore_Firmware/ZEBJUS_FLIGHTCORE_*_APP.bin FlightCore_Firmware/
            for f in "$PUB_DIR"/FlightCore_Firmware/ZEBJUS_FLIGHTCORE_*_FACTORY.bin; do
              [ -e "$f" ] || continue
              cp "$f" FlightCore_Firmware/
            done
            cp "$PUB_DIR/FlightCore_Firmware/catalog.json" "$PUB_DIR/FlightCore_Firmware/latest.json" "$PUB_DIR/FlightCore_Firmware/build-report.json" FlightCore_Firmware/
            cp "$PUB_DIR/firmware-catalog.json" "$PUB_DIR/firmware-latest.json" ./

            # Reapply compiled metadata to the current updater source, preserving
            # newer unrelated UI edits after the rebase. Refresh every cached hash.
            python3 -c 'import json,runpy; c=json.load(open("FlightCore_Firmware/catalog.json")); runpy.run_path("tools/build_firmware.py")["write_metadata"](c,c["version"],c["builtAt"])'
            python3 tools/make_offline_manifest.py
            python3 -B tools/cleanup_repo.py
            python3 -B tools/release_integrity.py --write
            test -s FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A1_APP.bin
            test -s FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A2_APP.bin
            python3 tools/validate_project.py
            python3 tools/validate_offline_bundle.py

            git add -A
            if git diff --cached --quiet; then
              echo "No firmware output changes to publish."
              exit 0
            fi
            git commit -m "Build ZEBJUS FlightCore ${VERSION} firmware packages [skip ci]"
            if git push origin HEAD:main; then
              echo "Published A1 + A2 firmware packages successfully."
              exit 0
            fi

            echo "Remote advanced during publish; retrying on latest main."
            sleep $((attempt * 2))
          done

          echo "Firmware artifacts are available from this Actions run, but repository publication could not complete after 4 attempts."
          exit 1
