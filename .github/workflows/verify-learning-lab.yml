name: Verify and build Learning Lab V18.3.67
on:
  workflow_dispatch:
  push:
    branches: ['main', 'release/v18.3.67', 'release/v18.3.67-ui', 'release/v18.3.67-wix']
permissions:
  contents: write
concurrency:
  group: learning-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  learning-browser:
    name: Verify learning workspace in the browser
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify navigation, tools, live training bridge and responsive views
        env:
          ZEBJUS_LEARNING_SCREENSHOTS: ${{ runner.temp }}/learning-lab-screenshots
          ZEBJUS_WIX_SCREENSHOTS: ${{ runner.temp }}/wix-embed-screenshots
          ZEBJUS_TRAINING_SCREENSHOTS: ${{ runner.temp }}/training-screenshots
        run: |
          npm run check
          npm run release:check
          npm run test:setup-browser
          npm run test:receiver
          npm run test:expansion
          npm run test:setup-session
          npm run test:learning-browser
          npm run test:fc-setup
          npm run test:training-core
          npm run test:training-browser
          npm run test:wix
          node android-app/tests/browser_transport_test.js
          node android-app/tests/browser_modes_test.js
      - name: Retain learning workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aerion-Learning-Lab-UI-V18.3.67
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/learning-lab-screenshots
            ${{ runner.temp }}/wix-embed-screenshots
            ${{ runner.temp }}/training-screenshots
  verify-build:
    needs: learning-browser
    # Main has dedicated Android and firmware build workflows.
    if: github.ref == 'refs/heads/release/v18.3.67'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARDUINO_NETWORK_CONNECTION_TIMEOUT: 120s
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile both pinned FlightCore profiles
        run: |
          python3 tools/embed_ap_pages.py --check
          python3 tools/build_firmware.py
      - name: Compile matching Android APK with the existing signing key
        run: |
          set -euo pipefail
          aerion_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          "$aerion_sdk/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
          python3 android-app/tools/build_apk.py --verify-only --build-tools "$aerion_sdk/build-tools/36.0.0" --android-jar "$aerion_sdk/platforms/android-36/android.jar"
          rm -f android-app/dist/ZEBJUS_Aerion_V18_3_64_Android.apk
      - name: Seal complete release inventory
        run: npm run release:seal
      - name: Install browser verification dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Run source, physics, control, setup and packaging checks
        run: |
          npm run check
          npm run release:check
          npm run test:control
          npm run test:setup
          npm run test:upload
          npm run test:flight-math
          npm run test:rc-link
          npm run test:fc-setup
          npm run test:fc-setup
          npm run test:training-core
          python3 -B tools/test_expansion_contract.py
          node android-app/tests/browser_transport_test.js
          node android-app/tests/browser_modes_test.js
          mkdir -p /tmp/aerion-java
          javac -d /tmp/aerion-java android-app/app/src/main/java/in/zebjus/aerion/{LeaseGate,LocalPolicy,LaunchPolicy,NativeRcStream}.java android-app/tests/{LeaseGateTest,NativeRcStreamTest}.java
          java -cp /tmp/aerion-java in.zebjus.aerion.LeaseGateTest
          java -cp /tmp/aerion-java in.zebjus.aerion.NativeRcStreamTest
      - name: Run complete browser flows
        env:
          ZEBJUS_LEARNING_SCREENSHOTS: ${{ runner.temp }}/learning-lab-screenshots
          ZEBJUS_SETUP_SCREENSHOT: ${{ runner.temp }}/learning-lab-screenshots/setup_receiver.png
          ZEBJUS_TEST_OUTPUT: ${{ runner.temp }}/learning-lab-screenshots
        run: |
          mkdir -p "$ZEBJUS_LEARNING_SCREENSHOTS"
          aerion_browser_failures=0
          for aerion_test in setup-browser floating flight real-browser mobile-view recovery network ui; do
            echo "::group::Browser flow: $aerion_test"
            if ! npm run "test:$aerion_test"; then
              aerion_browser_failures=$((aerion_browser_failures + 1))
            fi
            echo '::endgroup::'
          done
          test "$aerion_browser_failures" -eq 0
      - name: Publish verified generated packages to the release branch
        run: |
          set -euo pipefail
          python3 tools/cleanup_repo.py
          npm run release:seal
          npm run release:check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FlightCore_Firmware firmware-catalog.json firmware-latest.json firmware-updater.js android-app/dist FILE_COUNT.txt offline-manifest.json release-integrity.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified V18.3.67 firmware and Android packages [skip ci]'
            git push origin HEAD:release/v18.3.67
          fi
      - name: Retain APK, firmware and UI verification images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aerion-Learning-Lab-V18.3.67
          if-no-files-found: warn
          path: |
            android-app/dist
            FlightCore_Firmware/*.bin
            ${{ runner.temp }}/learning-lab-screenshots
