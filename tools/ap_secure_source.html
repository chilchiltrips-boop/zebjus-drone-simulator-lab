<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEBJUS Wi-Fi maintenance</title><style>body{font:16px system-ui;background:#101822;color:#fff;max-width:480px;margin:30px auto;padding:18px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0}#msg{white-space:pre-wrap}dialog{max-width:420px}</style><h1>ZEBJUS Wi-Fi maintenance</h1><p>AP password: 12345678. Press Connect kit; local AP authentication is automatic on updated firmware. AP flight controls are available in the installed app; training and PID use router Wi-Fi.</p><button id="pair">Connect kit</button><form id="f"><label>Router SSID<input name="ssid" required maxlength="32" autocomplete="off"></label><label>Password<input name="password" type="password" maxlength="63" autocomplete="off"></label><label>Kit name (optional)<input name="name" maxlength="32"></label><button id="save" disabled>Test and save Wi-Fi</button></form><button id="sta" disabled>Use saved router Wi-Fi</button><p id="msg" role="status"></p>
<!-- SECURE_SCRIPTS -->
<script>
(()=>{'use strict';const f=document.querySelector('#f'),msg=document.querySelector('#msg'),save=document.querySelector('#save'),sta=document.querySelector('#sta');let session,id;const client='WEB-'+ZfcSecurity.hex(crypto.getRandomValues(new Uint8Array(16)));
async function raw(path,data){const r=await fetch(path,data?{method:'POST',body:new URLSearchParams(data)}:{}),j=await r.json();if(!r.ok||j.ok===false)throw Error(j.message||'Kit request failed');return j;}
async function api(path,data){if(!session)throw Error('Pair your kit first');return session.request(path,data?{...data,clientId:client,expectedDeviceId:id}:null,raw,7000,data?'POST':'GET');}
document.querySelector('#pair').onclick=async()=>{try{const st=await raw('/api/status');id=st.deviceId;session=await ZfcSecurity.ensure(location.origin,st,client,'WEB',raw);await api('/api/security/maintenance',{});save.disabled=sta.disabled=false;msg.textContent='Paired '+st.name+' · '+id;}catch(e){msg.textContent=e.message;}};
f.onsubmit=async e=>{e.preventDefault();save.disabled=sta.disabled=true;try{await api('/api/setup/test',Object.fromEntries(new FormData(f)));for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,500));const d=await api('/api/setup/test/status');msg.textContent=d.message||'Testing Wi-Fi…';if(d.status==='failed')throw Error(d.message);if(d.status==='success'){f.password.value='';msg.textContent=d.message+'\nKit: '+d.name+'\nSTA IP: '+d.staIp+'\nJoin '+d.ssid+' and reconnect your paired app / WebApp.';return;}}throw Error('Wi-Fi test timed out.');}catch(e){msg.textContent=e.message;save.disabled=sta.disabled=false;}};
sta.onclick=async()=>{try{await api('/api/wifi/sta',{});msg.textContent='Restarting. Join router Wi-Fi and reconnect the app.';}catch(e){msg.textContent=e.message;}};
})();
</script></html>
