<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEBJUS Wi-Fi maintenance</title><style>body{font:16px system-ui;background:#101822;color:#fff;max-width:480px;margin:30px auto;padding:18px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0}#msg{white-space:pre-wrap}dialog{max-width:420px}</style><h1>ZEBJUS Wi-Fi maintenance</h1><p>AP password: 12345678. Connect kit for network recovery. AP setup authentication does not permit motor control. Android flight control requires the independent OWNER pairing code. Saved router Wi-Fi is tried first at boot; if unavailable, the kit starts its recovery AP.</p><button id="pair">Connect kit</button><button id="scan" disabled>Scan nearby Wi-Fi</button><label>Nearby networks<select id="networks"><option value="">Scan to find networks</option></select></label><p id="profiles"></p><form id="f"><label>Router SSID<input name="ssid" required maxlength="32" autocomplete="off"></label><label>Password<input name="password" type="password" maxlength="63" autocomplete="off"></label><label>Kit name (optional)<input name="name" maxlength="32"></label><button id="save" disabled>Test &amp; save Wi-Fi</button></form><button id="sta" disabled>Use saved router Wi-Fi</button><p id="msg" role="status"></p>
<!-- SECURE_SCRIPTS -->
<script>
(()=>{'use strict';const scan=document.querySelector('#scan'),networks=document.querySelector('#networks'),f=document.querySelector('#f'),msg=document.querySelector('#msg'),save=document.querySelector('#save'),sta=document.querySelector('#sta');let session,id;const client='WEB-'+ZfcSecurity.hex(crypto.getRandomValues(new Uint8Array(16)));
async function raw(path,data){const r=await fetch(path,data?{method:'POST',body:new URLSearchParams(data)}:{}),j=await r.json();if(!r.ok||j.ok===false)throw Error(j.message||'Kit request failed');return j;}
async function api(path,data){if(!session)throw Error('Pair your kit first');return session.request(path,data?{...data,clientId:client,expectedDeviceId:id}:null,raw,7000,data?'POST':'GET');}
document.querySelector('#pair').onclick=async()=>{try{const st=await raw('/api/status');id=st.deviceId;session=await ZfcSecurity.ensure(location.origin,st,client,'WEB',raw);await api('/api/security/maintenance',{});save.disabled=sta.disabled=scan.disabled=false;const saved=await api('/api/wifi/saved');document.querySelector('#profiles').textContent='Saved networks: '+((saved.profiles||[]).map(p=>p.ssid+(p.preferred?' (preferred)':'')).join(', ')||'none');const d=await api('/api/status'),w=d.wifiDiagnostics;msg.textContent='Connected '+st.name+(w?.attemptedSsid&&w.attemptStatus!==3?'\nSaved router '+w.attemptedSsid+' did not connect (disconnect reason '+w.disconnectReason+'). Choose Use saved router Wi-Fi to retry, or update the profile.':'');void scanNetworks();}catch(e){msg.textContent=e.message;}};
async function scanNetworks(){if(scan.disabled)return;scan.disabled=true;networks.replaceChildren(new Option('Scanning 2.4 GHz networks…',''));try{await api('/api/security/maintenance',{});let d;for(let i=0;i<70;i++){d=await api('/api/wifi/scan');if(!d.scanning)break;await new Promise(r=>setTimeout(r,300));}if(d?.scanning)throw Error('Wi-Fi scan is taking too long; retry or enter the SSID manually.');const matches=[...new Map((d.networks||[]).filter(n=>n.ssid).sort((a,b)=>Number(b.rssi)-Number(a.rssi)).map(n=>[n.ssid,n])).values()];networks.replaceChildren(new Option(matches.length?'Select a nearby network':'No 2.4 GHz networks found — enter SSID',''),...matches.map(n=>new Option(n.ssid+' · '+n.rssi+' dBm'+(n.secure?' · secured':''),n.ssid)));if(matches.length===1){networks.value=matches[0].ssid;if(!f.elements.ssid.value.trim())f.elements.ssid.value=matches[0].ssid;}msg.textContent=matches.length+' nearby 2.4 GHz network(s) found. Select a network or type its SSID.';}catch(e){networks.replaceChildren(new Option('Scan failed — retry or type SSID',''));msg.textContent='Wi-Fi scan failed: '+e.message;}finally{scan.disabled=false;}}
scan.onclick=scanNetworks;networks.onchange=()=>{if(networks.value)f.elements.ssid.value=networks.value;};
f.onsubmit=async e=>{e.preventDefault();save.disabled=sta.disabled=scan.disabled=true;try{await api('/api/security/maintenance',{});await api('/api/setup/test',Object.fromEntries(new FormData(f)));let d;for(let i=0;i<55;i++){await new Promise(r=>setTimeout(r,500));d=await api('/api/setup/test/status');if(d.status==='failed')throw Error(d.message||'Wi-Fi test failed');if(d.status==='success')break;msg.textContent='Testing router Wi-Fi. Stay connected to the kit AP.';}if(d?.profileSaved!==true||d?.connectionVerified!==true)throw Error('Wi-Fi test/save was not confirmed. Keep the AP connection and retry.');f.elements.password.value='';msg.textContent=d.message+'\nKit: '+d.name+'\nJoin '+d.ssid+' and reconnect'+(d.staIp?' at '+d.staIp:'')+'. If the router is unavailable, join the kit AP again.';}catch(e){msg.textContent=e.message;save.disabled=sta.disabled=scan.disabled=false;}finally{}};

sta.onclick=async()=>{try{await api('/api/wifi/sta',{});msg.textContent='Restarting. Join router Wi-Fi and reconnect the app.';}catch(e){msg.textContent=e.message;}};
})();
</script></html>
