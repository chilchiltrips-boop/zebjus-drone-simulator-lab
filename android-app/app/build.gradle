plugins { id 'com.android.application' }
android {
    namespace 'in.zebjus.aerion'
    compileSdk 36
    defaultConfig { applicationId 'in.zebjus.aerion'; minSdk 26; targetSdk 36; versionCode 1838101; versionName '18.3.81-android.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs { development { storeFile rootProject.file('signing/aerion-development.p12'); storePassword System.getenv('AERION_DEVELOPMENT_STORE_PASSWORD'); keyAlias 'aerion-development'; keyPassword System.getenv('AERION_DEVELOPMENT_STORE_PASSWORD') } }
    buildTypes {
        debug { signingConfig signingConfigs.development }
        release { minifyEnabled false; signingConfig signingConfigs.development }
    }
}
