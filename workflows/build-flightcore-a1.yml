name: Build ZEBJUS FlightCore A1 Firmware
on:
  workflow_dispatch:
  push:
    paths:
      - 'FlightCore_Firmware/**'
      - 'tools/build_firmware.py'
      - '.github/workflows/build-flightcore-a1.yml'

permissions:
  contents: write

jobs:
  build-a1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Compile real ESP32-C3 application binary
        run: python3 tools/build_firmware.py --board ZFC-A1

      - name: Show produced firmware
        run: |
          ls -lh FlightCore_Firmware/*.bin
          sha256sum FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A1_V18_3_23_APP.bin

      - name: Upload actual .bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZEBJUS_FLIGHTCORE_A1_V18_3_23
          path: |
            FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A1_V18_3_23_APP.bin
            FlightCore_Firmware/catalog.json
            firmware-catalog.json

      - name: Publish actual .bin into repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             FlightCore_Firmware/ZEBJUS_FLIGHTCORE_A1_V18_3_23_APP.bin             FlightCore_Firmware/catalog.json             firmware-catalog.json
          if git diff --cached --quiet; then
            echo "No firmware output changes to publish."
          else
            git commit -m "Build actual ZEBJUS FlightCore A1 V18.3.23 firmware [skip ci]"
            git push
          fi
